  roots: []                    # OpenNeuro ds007427 (Universidad de Antioquia, CC0)
  file_glob: "VERIFY"
  exclude_dirs: [derivatives]
  subject_regex: "(sub-[A-Z]+\\d+)"
  participants_glob: "**/participants.tsv"
  column_map: {participant_id: subject, MM_total: mmse}
  group_map: {}                # group is encoded in the ID prefix: CTR / DCL (MCI) / DTA (AD) / G (PSEN1 study) - VERIFY
  line_freq: 60.0
  notes: "CN 36, MCI 24, AD 8 + 70 PSEN1-E280A carriers/non-carriers. VERIFY sampling rate and filters in sidecars."

